name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "日迹 v__VERSION__"
          releaseBody: "自动构建版本 v__VERSION__"
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

      - name: Publish updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $release = $releaseJson | ConvertFrom-Json
          $installer = $release.assets | Where-Object { $_.name -like "*setup.exe" } | Select-Object -First 1
          $signatureAsset = $release.assets | Where-Object { $_.name -like "*.exe.sig" } | Select-Object -First 1
          if (-not $installer -or -not $signatureAsset) {
            throw "Release assets are incomplete."
          }
          $signature = gh api --header "Accept: application/octet-stream" $signatureAsset.url
          $manifest = @{
            version = $version
            notes = "日迹 v$version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature.Trim()
                url = $installer.browser_download_url
              }
            }
          } | ConvertTo-Json -Depth 6
          Set-Content -LiteralPath latest.json -Value $manifest -Encoding utf8
          gh release upload $tag latest.json --clobber
